<section class="card">
  <h2>Novo Usuário</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Login</mat-label>
      <input matInput formControlName="login" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Senha</mat-label>
      <input matInput type="password" formControlName="senha" />
    </mat-form-field>

    <div class="form-actions">
      <button type="submit" mat-flat-button color="primary" [disabled]="submitting()">
        {{ submitting() ? 'Salvando...' : 'Cadastrar' }}
      </button>
    </div>
  </form>
</section>

<section class="card">
  <div class="list-header">
    <h2>Usuários cadastrados</h2>
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Filtrar por status</mat-label>
      <mat-select [value]="filtroStatus()" (selectionChange)="onFiltroChange($event.value)">
        <mat-option value="">Todos</mat-option>
        <mat-option value="Ativo">Ativo</mat-option>
        <mat-option value="Inativo">Inativo</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
    <ng-container matColumnDef="login">
      <th mat-header-cell *matHeaderCellDef>Login</th>
      <td mat-cell *matCellDef="let u">{{ u.login }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let u">{{ u.status }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let u">
        <button mat-icon-button aria-label="Editar usuário" (click)="editar(u)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">Nenhum usuário cadastrado.</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" [pageSize]="10" showFirstLastButtons></mat-paginator>
</section>
