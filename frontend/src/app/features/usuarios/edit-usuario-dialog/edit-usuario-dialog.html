<h2 mat-dialog-title>Editar usuário — {{ usuario.login }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Nova senha</mat-label>
      <input matInput type="password" formControlName="senha" autocomplete="new-password" />
      <mat-hint>Deixe em branco para manter a senha atual.</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="Ativo">Ativo</mat-option>
        <mat-option value="Inativo">Inativo</mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="cancel()">Cancelar</button>
    <button type="submit" mat-flat-button color="primary">Salvar</button>
  </mat-dialog-actions>
</form>
