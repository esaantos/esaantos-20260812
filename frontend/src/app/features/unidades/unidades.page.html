<section class="card">
  <h2>Nova Unidade</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" />
    </mat-form-field>

    <div class="form-actions">
      <button type="submit" mat-flat-button color="primary" [disabled]="submitting()">
        {{ submitting() ? 'Salvando...' : 'Cadastrar' }}
      </button>
    </div>
  </form>
</section>

<section class="card">
  <h2>Unidades cadastradas</h2>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
    <ng-container matColumnDef="codigoUnidade">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let u">{{ u.codigoUnidade }}</td>
    </ng-container>

    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let u">{{ u.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let u">{{ u.status }}</td>
    </ng-container>

    <ng-container matColumnDef="colaboradores">
      <th mat-header-cell *matHeaderCellDef>Colaboradores</th>
      <td mat-cell *matCellDef="let u">
        @if (u.colaboradores.length === 0) {
          <span class="hint">Nenhum</span>
        } @else {
          <button mat-button (click)="verColaboradores(u)">
            {{ u.colaboradores.length }} colaborador{{ u.colaboradores.length === 1 ? '' : 'es' }}
          </button>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let u">
        @if (u.status === 'Ativo') {
          <button mat-icon-button aria-label="Inativar unidade" (click)="inativar(u)">
            <mat-icon>block</mat-icon>
          </button>
        } @else {
          <button mat-icon-button aria-label="Ativar unidade" (click)="ativar(u)">
            <mat-icon>check_circle</mat-icon>
          </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">Nenhuma unidade cadastrada.</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" [pageSize]="10" showFirstLastButtons></mat-paginator>
</section>
